# Ejemplo de configuracion de nginx para PRODUCCION (items 18 y 19).
# - Redirige TODO el trafico HTTP a HTTPS.
# - HTTPS con TLS moderno (certificados de Let's Encrypt: certbot --nginx).
# - Sirve el frontend compilado (aimotion-web/dist) con cabeceras de seguridad y CSP.
# - Reenvia /api y /socket.io al backend Node (que usa TRUST_PROXY=1 para ver HTTPS y la IP real).
# Reemplaza app.tudominio.com / api.tudominio.com y las rutas. Frontend y API deben ser del
# MISMO SITIO (p. ej. app.tudominio.com y api.tudominio.com) para que SameSite=Strict funcione.

server {
    listen 80;
    server_name app.tudominio.com api.tudominio.com;
    return 301 https://$host$request_uri;
}

# ---------------------------- FRONTEND ----------------------------
server {
    listen 443 ssl http2;
    server_name app.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/app.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /var/www/aimotion-web/dist;
    index index.html;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Si activas Turnstile, agrega https://challenges.cloudflare.com a script-src y frame-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.tudominio.com wss://api.tudominio.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ------------------------------ API -------------------------------
server {
    listen 443 ssl http2;
    server_name api.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/api.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tudominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    server_tokens off;

    client_max_body_size 64k;   # la API solo recibe JSON pequeno (y rechaza archivos)

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # NO se reenvia lo que mande el cliente
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (alertas en vivo)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
